name: Deploy SDK example to Pages

on:
  push:
    branches: [master]
    paths:
      - examples/embed/**
      - packages/core/**
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build core
        run: npm run build -w @speechpad/core

      - name: Assemble site
        run: |
          mkdir -p site
          cp examples/embed/index.html examples/embed/demo.css examples/embed/demo.js site/
          cp packages/core/dist/speechpad.js packages/core/dist/speechpad.js.map site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
